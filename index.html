<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumi VRM</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", "Yu Gothic", "Hiragino Sans", sans-serif;
      }

      canvas {
        display: block;
      }

      #vn-ui {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        padding: 0 6vw 28px;
        pointer-events: none;
      }

      #dialogue-box, button, input {
        pointer-events: auto;
        -webkit-app-region: no-drag;
        max-width: 960px;
        margin: 0 auto;
        padding: 18px 24px 16px;
        color: #f4f1ea;
        background: rgba(12, 10, 18, 0.4);
        border: 1px solid rgba(255, 236, 210, 0.28);
        border-radius: 6px 6px 18px 18px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.35) inset,
          0 18px 40px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
      }

      .speaker {
        display: inline-block;
        margin-bottom: 10px;
        padding: 4px 14px;
        font-size: 0.85rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #1a1220;
        background: linear-gradient(180deg, #ffe7c2 0%, #e8b86d 100%);
        border-radius: 999px;
      }

      #dialogue-text {
        min-height: 4.4em;
        margin-bottom: 16px;
        font-size: 1.08rem;
        line-height: 1.55;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        white-space: pre-wrap;
      }

      #chat-form {
        display: flex;
        gap: 10px;
      }

      #chat-input {
        flex: 1;
        min-width: 0;
        padding: 12px 16px;
        color: #f7f3ea;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 236, 210, 0.22);
        border-radius: 10px;
        outline: none;
      }

      #chat-input:focus {
        border-color: rgba(232, 184, 109, 0.8);
        box-shadow: 0 0 0 3px rgba(232, 184, 109, 0.18);
      }

      #chat-input::placeholder {
        color: rgba(244, 241, 234, 0.45);
      }
      
      #mic-btn,
      #send-btn {
        padding: 12px 22px;
        color: #1a1220;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        background: linear-gradient(180deg, #ffe7c2 0%, #e8b86d 100%);
        border: none;
        border-radius: 10px;
      }
      #mic-btn { padding: 12px 16px; }

      #send-btn:hover:not(:disabled), #mic-btn:hover {
        filter: brightness(1.06);
      }

      #send-btn:disabled, #mic-btn:disabled {
        cursor: wait;
        opacity: 0.55;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.4/lib/three-vrm.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="vn-ui">
      <div id="dialogue-box">
        <div class="speaker">Lumi</div>
        <p id="dialogue-text">Hello. Type a message below, then press Send.</p>
        <form id="chat-form" autocomplete="off">
          <button type="button" id="mic-btn">🎙️</button>
          <input
            id="chat-input"
            type="text"
            name="message"
            placeholder="Write your line..."
            maxlength="2000"
          />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
